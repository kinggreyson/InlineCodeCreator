name: Feature request
description: Suggest something Inline Code Creator should do.
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem, not the solution. A clear problem can be solved several ways; a solution on its own leaves us guessing what you need. Check the design's [non-goals](https://github.com/kinggreyson/InlineCodeCreator/blob/main/docs/design.md) first: those are out of scope on purpose.
  - type: textarea
    id: need
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
      placeholder: The code cell doesn't expand as I type code.
    validations:
      required: true
  - type: input
    id: who
    attributes:
      label: Who has this problem
      description: A student, a contributor, or a maintainer of the project?
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What you do today instead
      description: The workaround tells us how much this costs you now.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: An idea for how it could work (optional)
